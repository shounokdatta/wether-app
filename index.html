<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <img src="element/iCons - Apple App Icons.png"></img>
            :<span id="brandName">Weather</span>
      </nav>
      <div class="contenar">

        <div class="card">
          <input id="inputText">
          <button id="submit">Scarch</button>
            <div class="card-body">
              <p class="card-text">
                <h2><span id="cityName"></span></h2>
                <ul>
                    <li >Cloud pct is :<span id="cloud_pct"></span></li>
                    <li >Temp is  :<span id="temp"></span>   </li>
                    <li >Feels like :<span id="feels_like"></span></li>
                    <li >Humidity :<span id="humidity"></span> </li>
                    <li >Min temp :<span id="min_temp"></span> </li>
                    <li >Max temp :<span id="max_temp"></span>   </li>
                    <li >Wind speed :<span id="wind_speed"></span>  </li>
                    <li >Wind degrees :<span id="wind_degrees"></span> </li>
                    <li >Sunrise :<span id="sunrise"></span>      </li>
                    <li >Sunset :<span id="sunset"></span>     </li>  
            </ul>
            </div>
          </div>
      </div>
      <script src="script.js"></script>
</body>
</html>
